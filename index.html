<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISBN価格カウンター</title>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 16px;
    }

    h2 {
      font-size: 18px;
      margin: 24px 0 10px;
    }

    .box {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    #status {
      margin-top: 12px;
      min-height: 24px;
      font-weight: bold;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    .danger {
      background: #a00;
    }

    .secondary {
      background: #666;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
    }

    .price-list,
    .book-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .price-list li,
    .book-list li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .price-list li:last-child,
    .book-list li:last-child {
      border-bottom: none;
    }

    .small {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>ISBN価格カウンター</h1>

  <div class="box">
    <div id="reader"></div>
    <div id="status">カメラを起動しています…</div>
  </div>

  <div class="box">
    <h2>ISBNを手入力</h2>
    <input
      type="text"
      id="isbnInput"
      inputmode="numeric"
      placeholder="ISBN-13を入力"
    >
    <button onclick="manualAdd()">追加</button>
  </div>

  <div class="box">
    <div class="total">
      合計冊数：<span id="totalBooks">0</span>冊
    </div>

    <div class="total" style="margin-top:8px;">
      合計本体価格：¥<span id="totalPrice">0</span>
    </div>

    <button class="secondary" onclick="undoLastBook()">
      直前の本を取り消す
    </button>

    <button class="danger" onclick="resetAll()">
      すべてリセット
    </button>
  </div>

  <div class="box">
    <h2>価格別冊数</h2>
    <ul id="priceList" class="price-list"></ul>
  </div>

  <div class="box">
    <h2>読み取った本</h2>
    <ul id="bookList" class="book-list"></ul>
  </div>

<script>
let codeReader = null;
let controls = null;

let totalBooks = 0;
let totalPrice = 0;

let priceCounts = {};
let books = [];

let lastISBN = "";
let processing = false;

let pendingISBN = "";
let pendingPrice = null;
let pendingTimer = null;

let lastDetectedCode = "";
let lastDetectedTime = 0;

let statusTimer = null;


/* =========================
   基本処理
========================= */

function setStatus(message) {
  const status = document.getElementById("status");
  status.textContent = message;

  if (statusTimer) {
    clearTimeout(statusTimer);
    statusTimer = null;
  }
}


/* =========================
   ISBNチェック
========================= */

function isValidISBN13(code) {
  if (!/^\d{13}$/.test(code)) {
    return false;
  }

  if (!code.startsWith("978") && !code.startsWith("979")) {
    return false;
  }

  let sum = 0;

  for (let i = 0; i < 12; i++) {
    sum += Number(code[i]) * (i % 2 === 0 ? 1 : 3);
  }

  const checkDigit = (10 - (sum % 10)) % 10;

  return checkDigit === Number(code[12]);
}


/* =========================
   本の下側JANコード
   192 + Cコード4桁 + 本体価格5桁 + チェック1桁
========================= */

function isValidBookJANSecondCode(code) {
  if (!/^\d{13}$/.test(code)) {
    return false;
  }

  if (!code.startsWith("192")) {
    return false;
  }

  let sum = 0;

  for (let i = 0; i < 12; i++) {
    sum += Number(code[i]) * (i % 2 === 0 ? 1 : 3);
  }

  const checkDigit = (10 - (sum % 10)) % 10;

  return checkDigit === Number(code[12]);
}


function getPriceFromBookJAN(code) {
  const priceString = code.substring(7, 12);
  return Number(priceString);
}


/* =========================
   openBD
   タイトル取得を最優先
========================= */

async function getBookInfo(isbn, barcodePrice) {

  let title = "";
  let onlinePrice = null;

  try {
    const response = await fetch(
      "https://api.openbd.jp/v1/get?isbn=" +
      encodeURIComponent(isbn)
    );

    if (response.ok) {
      const data = await response.json();
      const book = data && data[0];

      if (book) {
        if (book.summary && book.summary.title) {
          title = book.summary.title;
        }

        try {
          const prices =
            book.onix.ProductSupply.SupplyDetail.Price;

          if (Array.isArray(prices)) {
            for (const p of prices) {
              const amount = Number(p.PriceAmount);

              if (amount > 0) {
                onlinePrice = amount;
                break;
              }
            }
          }
        } catch (e) {
          // 価格情報がない本はそのまま進める
        }
      }
    }
  } catch (e) {
    // openBDが使えなくても続行
  }


  /*
    価格バーコードが読めている場合は、
    オンライン価格を一切使わない。
  */

  if (barcodePrice !== null && barcodePrice !== undefined) {
    return {
      title: title || "タイトル不明",
      price: barcodePrice,
      priceFromBarcode: true
    };
  }


  /*
    下側バーコードが読めなかった場合だけ
    openBDの価格を使う。
  */

  if (onlinePrice !== null) {
    return {
      title: title || "タイトル不明",
      price: onlinePrice,
      priceFromBarcode: false
    };
  }


  /*
    タイトルが取れなくても、
    価格がない場合だけエラーにする。
  */

  return {
    title: title || "タイトル不明",
    price: null,
    priceFromBarcode: false
  };
}


/* =========================
   本を追加
========================= */

async function addBook(isbn, barcodePrice = null) {

  if (processing) {
    return;
  }

  if (!isValidISBN13(isbn)) {
    setStatus("有効なISBN-13ではありません");
    return;
  }


  /*
    同じISBNの連続読み取り防止
  */

  if (isbn === lastISBN) {
    setStatus("⚠️ 同じ本を続けて読み取りました");
    return;
  }

  processing = true;

  try {

    const info = await getBookInfo(isbn, barcodePrice);

    if (info.price === null) {
      setStatus(
        `${info.title}：価格を取得できませんでした`
      );

      processing = false;
      return;
    }


    const book = {
      isbn: isbn,
      title: info.title,
      price: info.price
    };

    books.push(book);

    totalBooks++;
    totalPrice += info.price;

    if (!priceCounts[info.price]) {
      priceCounts[info.price] = 0;
    }

    priceCounts[info.price]++;

    updateDisplay();

    lastISBN = isbn;


    /*
      効果音
    */

    beep();


    if (info.priceFromBarcode) {

      setStatus(
        `${info.title}（本体価格¥${info.price}・バーコードから取得）を追加しました`
      );

    } else {

      setStatus(
        `${info.title}（本体価格¥${info.price}）を追加しました`
      );
    }


    /*
      連続読み取りを邪魔しないよう、
      短時間だけ同じISBNを無視する。
    */

    setTimeout(() => {
      if (lastISBN === isbn) {
        lastISBN = "";
      }
    }, 500);

  } catch (error) {

    console.error(error);

    setStatus("本の情報を取得できませんでした");

  } finally {

    processing = false;
  }
}


/* =========================
   2本のバーコードを組み合わせる
========================= */

function schedulePendingAdd() {

  if (pendingTimer) {
    clearTimeout(pendingTimer);
  }

  /*
    以前の1.2秒から大幅短縮。
    ISBNと価格バーコードが続けて読まれるなら、
    ほぼ「ぴっぴっぴ」で処理できる。
  */

  pendingTimer = setTimeout(() => {

    pendingTimer = null;

    if (!pendingISBN) {
      return;
    }

    const isbn = pendingISBN;
    const price = pendingPrice;

    pendingISBN = "";
    pendingPrice = null;

    addBook(isbn, price);

  }, 250);
}


/* =========================
   バーコード読み取り
========================= */

function handleBarcode(text) {

  const code = String(text).replace(/\D/g, "");

  if (code.length !== 13) {
    return;
  }


  /*
    同じコードを短時間に何度も読んだ場合は無視
  */

  const now = Date.now();

  if (
    code === lastDetectedCode &&
    now - lastDetectedTime < 500
  ) {
    return;
  }

  lastDetectedCode = code;
  lastDetectedTime = now;


  /*
    上側：ISBN
  */

  if (isValidISBN13(code)) {

    pendingISBN = code;

    schedulePendingAdd();

    return;
  }


  /*
    下側：価格
  */

  if (isValidBookJANSecondCode(code)) {

    pendingPrice = getPriceFromBookJAN(code);

    if (pendingISBN) {
      schedulePendingAdd();
    }

    return;
  }
}


/* =========================
   カメラ起動
========================= */

async function startCamera() {

  codeReader = new ZXing.BrowserMultiFormatReader();

  try {

    const devices =
      await ZXing.BrowserMultiFormatReader.listVideoInputDevices();

    if (!devices.length) {
      setStatus("カメラが見つかりません");
      return;
    }


    /*
      背面カメラを優先
    */

    let selectedDeviceId = devices[0].deviceId;

    for (const device of devices) {

      const label =
        (device.label || "").toLowerCase();

      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("背面")
      ) {
        selectedDeviceId = device.deviceId;
        break;
      }
    }


    controls = await codeReader.decodeFromVideoDevice(
      selectedDeviceId,
      "reader",
      (result, error) => {

        if (result) {
          handleBarcode(result.getText());
        }

      }
    );

    setStatus("バーコードを読み取れます");

  } catch (error) {

    console.error(error);

    setStatus(
      "カメラを起動できませんでした"
    );
  }
}


/* =========================
   手入力
========================= */

function manualAdd() {

  const input =
    document.getElementById("isbnInput");

  const isbn =
    input.value.replace(/\D/g, "");

  if (!isValidISBN13(isbn)) {

    setStatus(
      "有効なISBN-13を入力してください"
    );

    return;
  }

  input.value = "";

  addBook(isbn, null);
}


/* =========================
   表示更新
========================= */

function updateDisplay() {

  document.getElementById("totalBooks").textContent =
    totalBooks.toLocaleString();

  document.getElementById("totalPrice").textContent =
    totalPrice.toLocaleString();


  /*
    価格別冊数
  */

  const priceList =
    document.getElementById("priceList");

  priceList.innerHTML = "";

  const prices =
    Object.keys(priceCounts)
      .map(Number)
      .sort((a, b) => a - b);

  for (const price of prices) {

    const li = document.createElement("li");

    li.textContent =
      `¥${price.toLocaleString()}：${priceCounts[price]}冊`;

    priceList.appendChild(li);
  }


  /*
    本一覧
  */

  const bookList =
    document.getElementById("bookList");

  bookList.innerHTML = "";

  for (const book of books) {

    const li = document.createElement("li");

    li.innerHTML =
      `<strong>${escapeHtml(book.title)}</strong><br>` +
      `<span class="small">` +
      `${book.isbn} / 本体価格¥${book.price.toLocaleString()}` +
      `</span>`;

    bookList.appendChild(li);
  }
}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   直前の本を取り消す
========================= */

function undoLastBook() {

  if (!books.length) {
    setStatus("取り消す本がありません");
    return;
  }

  const book = books.pop();

  totalBooks--;
  totalPrice -= book.price;

  priceCounts[book.price]--;

  if (priceCounts[book.price] <= 0) {
    delete priceCounts[book.price];
  }

  lastISBN =
    books.length
      ? books[books.length - 1].isbn
      : "";

  updateDisplay();

  setStatus(
    `${book.title}を取り消しました`
  );
}


/* =========================
   全リセット
========================= */

function resetAll() {

  if (
    !confirm(
      "読み取った本をすべてリセットしますか？"
    )
  ) {
    return;
  }

  totalBooks = 0;
  totalPrice = 0;

  priceCounts = {};
  books = [];

  lastISBN = "";

  pendingISBN = "";
  pendingPrice = null;

  if (pendingTimer) {
    clearTimeout(pendingTimer);
    pendingTimer = null;
  }

  updateDisplay();

  setStatus("リセットしました");
}


/* =========================
   ビープ音
========================= */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.frequency.value = 1000;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(
      0.08,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.08
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.08
    );

  } catch (e) {
    // 音が使えなくても本体処理には影響させない
  }
}


/* =========================
   起動
========================= */

startCamera();
updateDisplay();

</script>

</body>
</html>
