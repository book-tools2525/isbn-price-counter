<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISBN価格カウンター</title>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 16px;
    }

    h2 {
      font-size: 18px;
      margin: 24px 0 10px;
    }

    .box {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    #status {
      margin-top: 12px;
      min-height: 24px;
      font-weight: bold;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    .danger {
      background: #a00;
    }

    .secondary {
      background: #666;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
    }

    .price-list,
    .book-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .price-list li,
    .book-list li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .price-list li:last-child,
    .book-list li:last-child {
      border-bottom: none;
    }

    .small {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>ISBN価格カウンター</h1>

  <div class="box">
    <div id="reader"></div>
    <div id="status">カメラを起動しています…</div>
  </div>

  <div class="box">
    <h2>ISBNを手入力</h2>

    <input
      type="text"
      id="isbnInput"
      inputmode="numeric"
      placeholder="ISBN-13を入力"
    >

    <button onclick="manualAdd()">追加</button>
  </div>

  <div class="box">

    <div class="total">
      合計冊数：
      <span id="totalBooks">0</span>冊
    </div>

    <div class="total" style="margin-top:8px;">
      合計本体価格：
      ¥<span id="totalPrice">0</span>
    </div>

    <button class="secondary" onclick="undoLastBook()">
      直前の本を取り消す
    </button>

    <button class="danger" onclick="resetAll()">
      すべてリセット
    </button>

  </div>

  <div class="box">

    <h2>価格別冊数</h2>

    <ul id="priceList" class="price-list"></ul>

  </div>

  <div class="box">

    <h2>読み取った本</h2>

    <ul id="bookList" class="book-list"></ul>

  </div>


<script>

/* =========================
   変数
========================= */

let codeReader = null;
let controls = null;

let totalBooks = 0;
let totalPrice = 0;

let priceCounts = {};
let books = [];

let lastISBN = "";

let pendingISBN = "";
let pendingPrice = null;
let pendingTimer = null;

let lastDetectedCode = "";
let lastDetectedTime = 0;


/* =========================
   ステータス表示
========================= */

function setStatus(message) {

  document.getElementById("status").textContent =
    message;

}


/* =========================
   ISBN-13チェック
========================= */

function isValidISBN13(code) {

  if (!/^\d{13}$/.test(code)) {
    return false;
  }

  if (
    !code.startsWith("978") &&
    !code.startsWith("979")
  ) {
    return false;
  }

  let sum = 0;

  for (let i = 0; i < 12; i++) {

    sum +=
      Number(code[i]) *
      (i % 2 === 0 ? 1 : 3);

  }

  const checkDigit =
    (10 - (sum % 10)) % 10;

  return checkDigit === Number(code[12]);

}


/* =========================
   本の下側JANコードチェック
=========================

   192
   ↓
   Cコード4桁
   ↓
   本体価格5桁
   ↓
   チェックデジット1桁

========================= */

function isValidBookJANSecondCode(code) {

  if (!/^\d{13}$/.test(code)) {
    return false;
  }

  if (!code.startsWith("192")) {
    return false;
  }

  let sum = 0;

  for (let i = 0; i < 12; i++) {

    sum +=
      Number(code[i]) *
      (i % 2 === 0 ? 1 : 3);

  }

  const checkDigit =
    (10 - (sum % 10)) % 10;

  return checkDigit === Number(code[12]);

}


/* =========================
   下側JANから価格取得
========================= */

function getPriceFromBookJAN(code) {

  /*
    7～11文字目が本体価格5桁
  */

  return Number(
    code.substring(7, 12)
  );

}


/* =========================
   openBDからタイトル取得
========================= */

async function getBookInfo(isbn, barcodePrice) {

  let title = "";
  let onlinePrice = null;


  try {

    const response =
      await fetch(
        "https://api.openbd.jp/v1/get?isbn=" +
        encodeURIComponent(isbn)
      );


    if (response.ok) {

      const data =
        await response.json();

      const book =
        data && data[0];


      if (book) {

        /*
          タイトル
        */

        if (
          book.summary &&
          book.summary.title
        ) {

          title =
            book.summary.title;

        }


        /*
          価格バーコードが読めていない場合だけ、
          openBDの価格を使う。
        */

        if (
          barcodePrice === null ||
          barcodePrice === undefined
        ) {

          try {

            const prices =
              book.onix
                .ProductSupply
                .SupplyDetail
                .Price;


            if (Array.isArray(prices)) {

              for (const p of prices) {

                const amount =
                  Number(
                    p.PriceAmount
                  );


                if (amount > 0) {

                  onlinePrice =
                    amount;

                  break;

                }

              }

            }

          } catch (e) {

            /*
              価格情報がなければ
              そのまま進める。
            */

          }

        }

      }

    }

  } catch (error) {

    /*
      openBDに接続できなくても、
      バーコード価格があれば追加できる。
    */

  }


  /*
    本のバーコード価格を最優先
  */

  if (
    barcodePrice !== null &&
    barcodePrice !== undefined
  ) {

    return {

      title:
        title || "タイトル不明",

      price:
        barcodePrice,

      priceFromBarcode:
        true

    };

  }


  /*
    バーコード価格がない場合だけ
    openBD価格を使う。
  */

  if (onlinePrice !== null) {

    return {

      title:
        title || "タイトル不明",

      price:
        onlinePrice,

      priceFromBarcode:
        false

    };

  }


  /*
    タイトルは取れなくても、
    価格がなければ追加できない。
  */

  return {

    title:
      title || "タイトル不明",

    price:
      null,

    priceFromBarcode:
      false

  };

}


/* =========================
   本を追加
========================= */

async function addBook(
  isbn,
  barcodePrice = null
) {

  if (!isValidISBN13(isbn)) {

    setStatus(
      "有効なISBN-13ではありません"
    );

    return;

  }


  /*
    同じ本の二重読み取り防止
  */

  if (isbn === lastISBN) {

    setStatus(
      "⚠️ 同じ本を続けて読み取りました"
    );

    return;

  }


  /*
    ここでは「処理中だから次を無視する」
    という制限をかけない。
    
    連続スキャンを優先する。
  */


  try {

    const info =
      await getBookInfo(
        isbn,
        barcodePrice
      );


    /*
      価格が取れなかった場合
    */

    if (info.price === null) {

      setStatus(
        `${info.title}：価格を取得できませんでした`
      );

      return;

    }


    /*
      本を追加
    */

    const book = {

      isbn:
        isbn,

      title:
        info.title,

      price:
        info.price

    };


    books.push(book);

    totalBooks++;

    totalPrice +=
      info.price;


    /*
      価格別冊数
    */

    if (!priceCounts[info.price]) {

      priceCounts[info.price] =
        0;

    }

    priceCounts[info.price]++;


    updateDisplay();


    /*
      最後に読んだISBNを記録
    */

    lastISBN =
      isbn;


    /*
      ビープ音
    */

    beep();


    /*
      ステータス
    */

    if (info.priceFromBarcode) {

      setStatus(
        `${info.title}（本体価格¥${info.price}・バーコードから取得）を追加しました`
      );

    } else {

      setStatus(
        `${info.title}（本体価格¥${info.price}）を追加しました`
      );

    }


    /*
      0.5秒後に同じ本を再び読めるようにする
    */

    setTimeout(() => {

      if (lastISBN === isbn) {

        lastISBN = "";

      }

    }, 500);


  } catch (error) {

    console.error(error);

    setStatus(
      "本の情報を取得できませんでした"
    );

  }

}


/* =========================
   ISBNと価格バーコードを
   組み合わせる
========================= */

function schedulePendingAdd() {

  if (pendingTimer) {

    clearTimeout(
      pendingTimer
    );

  }


  /*
    ISBNと価格バーコードが
    250ms以内に来たらセットで処理。
  */

  pendingTimer =
    setTimeout(() => {

      pendingTimer = null;


      if (!pendingISBN) {
        return;
      }


      const isbn =
        pendingISBN;

      const price =
        pendingPrice;


      /*
        次の読み取りのために
        先にクリア。
      */

      pendingISBN = "";

      pendingPrice = null;


      addBook(
        isbn,
        price
      );


    }, 250);

}


/* =========================
   バーコード処理
========================= */

function handleBarcode(text) {

  const code =
    String(text)
      .replace(/\D/g, "");


  if (code.length !== 13) {
    return;
  }


  /*
    カメラが同じバーコードを
    何度も検出するのを防止。
  */

  const now =
    Date.now();


  if (
    code === lastDetectedCode &&
    now - lastDetectedTime < 500
  ) {

    return;

  }


  lastDetectedCode =
    code;

  lastDetectedTime =
    now;


  /*
    ISBN
  */

  if (isValidISBN13(code)) {

    pendingISBN =
      code;

    schedulePendingAdd();

    return;

  }


  /*
    下側価格バーコード
  */

  if (
    isValidBookJANSecondCode(code)
  ) {

    pendingPrice =
      getPriceFromBookJAN(code);


    /*
      ISBNをすでに読んでいれば
      すぐ追加処理を予約。
    */

    if (pendingISBN) {

      schedulePendingAdd();

    }

    return;

  }

}


/* =========================
   カメラ起動
========================= */

async function startCamera() {

  codeReader =
    new ZXing.BrowserMultiFormatReader();


  try {

    /*
      iPhone Safariでは
      listVideoInputDevices()で
      カメラ一覧を取得してから
      deviceIdを指定する方式より、

      facingMode: environment

      で背面カメラを直接指定する方が
      安定しやすい。
    */

    controls =
      await codeReader.decodeFromConstraints(

        {
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        },

        "reader",

        (result, error) => {

          if (result) {

            handleBarcode(
              result.getText()
            );

          }

        }

      );


    setStatus(
      "バーコードを読み取れます"
    );


  } catch (error) {

    console.error(
      "カメラ起動エラー:",
      error
    );


    setStatus(
      "カメラを起動できませんでした"
    );

  }

}


/* =========================
   手入力
========================= */

function manualAdd() {

  const input =
    document.getElementById(
      "isbnInput"
    );


  const isbn =
    input.value
      .replace(/\D/g, "");


  if (!isValidISBN13(isbn)) {

    setStatus(
      "有効なISBN-13を入力してください"
    );

    return;

  }


  input.value = "";


  addBook(
    isbn,
    null
  );

}


/* =========================
   表示更新
========================= */

function updateDisplay() {

  /*
    合計冊数
  */

  document
    .getElementById("totalBooks")
    .textContent =
      totalBooks.toLocaleString();


  /*
    合計価格
  */

  document
    .getElementById("totalPrice")
    .textContent =
      totalPrice.toLocaleString();


  /*
    価格別冊数
  */

  const priceList =
    document.getElementById(
      "priceList"
    );


  priceList.innerHTML =
    "";


  const prices =
    Object.keys(priceCounts)
      .map(Number)
      .sort(
        (a, b) => a - b
      );


  for (const price of prices) {

    const li =
      document.createElement(
        "li"
      );


    li.textContent =
      `¥${price.toLocaleString()}：${priceCounts[price]}冊`;


    priceList.appendChild(li);

  }


  /*
    本一覧
  */

  const bookList =
    document.getElementById(
      "bookList"
    );


  bookList.innerHTML =
    "";


  for (const book of books) {

    const li =
      document.createElement(
        "li"
      );


    li.innerHTML =
      `<strong>${escapeHtml(book.title)}</strong><br>` +
      `<span class="small">` +
      `${book.isbn} / 本体価格¥${book.price.toLocaleString()}` +
      `</span>`;


    bookList.appendChild(li);

  }

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   直前の本を取り消す
========================= */

function undoLastBook() {

  if (!books.length) {

    setStatus(
      "取り消す本がありません"
    );

    return;

  }


  const book =
    books.pop();


  totalBooks--;

  totalPrice -=
    book.price;


  priceCounts[book.price]--;


  if (
    priceCounts[book.price] <= 0
  ) {

    delete priceCounts[
      book.price
    ];

  }


  lastISBN =
    books.length
      ? books[
          books.length - 1
        ].isbn
      : "";


  updateDisplay();


  setStatus(
    `${book.title}を取り消しました`
  );

}


/* =========================
   全リセット
========================= */

function resetAll() {

  if (
    !confirm(
      "読み取った本をすべてリセットしますか？"
    )
  ) {

    return;

  }


  totalBooks = 0;

  totalPrice = 0;

  priceCounts = {};

  books = [];

  lastISBN = "";

  pendingISBN = "";

  pendingPrice = null;


  if (pendingTimer) {

    clearTimeout(
      pendingTimer
    );

    pendingTimer = null;

  }


  updateDisplay();


  setStatus(
    "リセットしました"
  );

}


/* =========================
   ビープ音
========================= */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      1000;

    oscillator.type =
      "sine";


    gain.gain.setValueAtTime(
      0.08,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.08
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.08
    );


  } catch (error) {

    /*
      音が使えなくても
      本体処理には影響させない。
    */

  }

}


/* =========================
   起動
========================= */

startCamera();

updateDisplay();

</script>

</body>
</html>
