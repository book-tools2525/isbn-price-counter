<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISBNカウンター</title>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 20px;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #reader {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      background: #111;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
      background: #111;
    }

    .guide {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 35%;
      height: 30%;
      border: 2px solid #00c853;
      border-radius: 6px;
      box-sizing: border-box;
      pointer-events: none;
    }

    .guide-text {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }

    #status {
      margin-top: 10px;
      padding: 10px;
      background: #f1f1f1;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 15px;
      cursor: pointer;
      background: #222;
      color: white;
      margin-top: 10px;
      margin-right: 6px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .stop {
      background: #777;
    }

    .danger {
      background: #b00020;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .totals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .total-item {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }

    .total-label {
      font-size: 13px;
      color: #666;
    }

    .total-value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }

    .book {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .book:last-child {
      border-bottom: none;
    }

    .book-title {
      font-weight: bold;
      line-height: 1.5;
    }

    .book-info {
      font-size: 13px;
      color: #666;
      margin-top: 3px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    .price-row:last-child {
      border-bottom: none;
    }

    .empty {
      color: #888;
      font-size: 14px;
    }

    .pending {
      background: #fff8e1 !important;
      color: #6d4c00;
    }
  </style>
</head>

<body>

  <h1>ISBNカウンター</h1>

  <div class="box">
    <h2>カメラ</h2>

    <div id="reader">
      <video id="video" autoplay playsinline muted></video>
      <div class="guide"></div>
    </div>

    <div class="guide-text">
      上のISBNバーコードを緑枠に合わせてください
    </div>

    <div id="status">
      カメラを起動してください
    </div>

    <button id="startButton">カメラを起動</button>
    <button id="stopButton" class="stop">カメラを停止</button>
  </div>

  <div class="box">
    <h2>ISBNを手入力</h2>

    <input
      id="isbnInput"
      type="text"
      inputmode="numeric"
      placeholder="ISBN13桁"
    >

    <button id="manualButton">追加</button>
  </div>

  <div class="box">
    <h2>合計</h2>

    <div class="totals">
      <div class="total-item">
        <div class="total-label">冊数</div>
        <div class="total-value" id="totalBooks">0</div>
      </div>

      <div class="total-item">
        <div class="total-label">本体価格合計</div>
        <div class="total-value" id="totalPrice">0円</div>
      </div>
    </div>

    <button id="undoButton">1冊戻す</button>
  </div>

  <div class="box">
    <h2>本の一覧</h2>
    <div id="bookList">
      <div class="empty">まだ本がありません</div>
    </div>
  </div>

  <div class="box">
    <h2>価格別</h2>
    <div id="priceList">
      <div class="empty">まだ本がありません</div>
    </div>
  </div>

  <div class="box">
    <button id="resetButton" class="danger">すべてリセット</button>
  </div>


<script>
  let codeReader = null;
  let controls = null;

  let books = [];
  let totalBooks = 0;
  let totalPrice = 0;
  let priceCounts = {};

  const video = document.getElementById("video");
  const statusText = document.getElementById("status");

  const startButton = document.getElementById("startButton");
  const stopButton = document.getElementById("stopButton");

  const isbnInput = document.getElementById("isbnInput");
  const manualButton = document.getElementById("manualButton");

  const undoButton = document.getElementById("undoButton");
  const resetButton = document.getElementById("resetButton");

  const totalBooksElement = document.getElementById("totalBooks");
  const totalPriceElement = document.getElementById("totalPrice");

  const bookList = document.getElementById("bookList");
  const priceList = document.getElementById("priceList");


  /*
   * ----------------------------------------
   * ISBN / JAN
   * ----------------------------------------
   */

  function normalizeISBN(value) {
    return String(value || "")
      .replace(/[^0-9Xx]/g, "")
      .toUpperCase();
  }


  function isValidISBN13(isbn) {
    if (!/^\d{13}$/.test(isbn)) {
      return false;
    }

    let sum = 0;

    for (let i = 0; i < 12; i++) {
      const digit = Number(isbn[i]);
      sum += digit * (i % 2 === 0 ? 1 : 3);
    }

    const check = (10 - (sum % 10)) % 10;

    return check === Number(isbn[12]);
  }


  /*
   * 日本の書籍用2段目JAN
   * 192 + Cコード4桁 + 本体価格5桁 + チェック1桁
   */

  function isValidBookJANSecondCode(code) {
    if (!/^\d{13}$/.test(code)) {
      return false;
    }

    if (!code.startsWith("192")) {
      return false;
    }

    let sum = 0;

    for (let i = 0; i < 12; i++) {
      const digit = Number(code[i]);

      if (i % 2 === 0) {
        sum += digit;
      } else {
        sum += digit * 3;
      }
    }

    const check = (10 - (sum % 10)) % 10;

    return check === Number(code[12]);
  }


  function getPriceFromBookJAN(code) {
    if (!isValidBookJANSecondCode(code)) {
      return null;
    }

    const priceText = code.substring(7, 12);
    const price = Number(priceText);

    if (!Number.isFinite(price) || price <= 0) {
      return null;
    }

    return price;
  }


  /*
   * ----------------------------------------
   * openBD
   * ----------------------------------------
   */

  async function getBookInfoFromOpenBD(isbn) {
    try {
      const response = await fetch(
        "https://api.openbd.jp/v1/get?isbn=" +
        encodeURIComponent(isbn)
      );

      if (!response.ok) {
        return null;
      }

      const data = await response.json();

      const item = data && data[0];

      if (!item) {
        return null;
      }

      /*
       * タイトル
       */
      let title = item?.summary?.title || null;

      if (!title) {
        title =
          item?.onix?.DescriptiveDetail?.TitleDetail?.TitleElement?.[0]
            ?.TitleText?.content || null;
      }

      /*
       * 価格
       *
       * PriceType 01 = 本体価格
       * PriceType 02 = 税込価格
       *
       * 本体価格を優先。
       */
      const prices =
        item?.onix?.ProductSupply?.SupplyDetail?.Price || [];

      let priceInfo =
        prices.find(price => price.PriceType === "01");

      if (!priceInfo) {
        priceInfo =
          prices.find(price => price.PriceType === "02");
      }

      if (!priceInfo && prices.length > 0) {
        priceInfo = prices[0];
      }

      let price = null;

      if (priceInfo?.PriceAmount != null) {
        const parsed = Number(priceInfo.PriceAmount);

        if (Number.isFinite(parsed) && parsed > 0) {
          price = parsed;
        }
      }

      /*
       * タイトルも価格もなければ
       * 「openBDに情報なし」と扱う
       */
      if (!title && price == null) {
        return null;
      }

      return {
        title: title || null,
        price: price
      };

    } catch (error) {
      console.error("openBD error:", error);
      return null;
    }
  }


  /*
   * ----------------------------------------
   * 保留中のISBN
   * ----------------------------------------
   *
   * openBDだけでは追加できなかった本。
   * 次に192から始まるJANを読むと確定する。
   */

  let pendingBook = null;

  /*
   * 同じバーコードがカメラに何度も映るのを防ぐ
   */
  let lastBarcode = "";
  let lastBarcodeTime = 0;

  /*
   * 現在openBDを問い合わせ中のISBN
   */
  const loadingISBNs = new Set();


  function showPendingMessage() {
    if (!pendingBook) {
      return;
    }

    const titleText =
      pendingBook.title || "タイトル不明";

    statusText.classList.add("pending");

    statusText.textContent =
      titleText +
      "：価格が取得できませんでした。下のバーコードをスキャンしてください";
  }


  function clearPendingBook() {
    pendingBook = null;
    statusText.classList.remove("pending");
  }


  /*
   * ----------------------------------------
   * 本を追加
   * ----------------------------------------
   */

  function addBookRecord(isbn, title, price) {

    if (!isbn || price == null) {
      return false;
    }

    price = Number(price);

    if (!Number.isFinite(price) || price <= 0) {
      return false;
    }

    const book = {
      isbn: isbn,
      title: title || "タイトル不明",
      price: price
    };

    books.push(book);

    totalBooks++;
    totalPrice += price;

    if (!priceCounts[price]) {
      priceCounts[price] = 0;
    }

    priceCounts[price]++;

    updateDisplay();

    beep();

    return true;
  }


  /*
   * ----------------------------------------
   * ISBNを処理
   * ----------------------------------------
   */

  async function handleISBN(isbn) {

    /*
     * すでに別の本が「下段JAN待ち」なら、
     * 先にその本を確定してもらう。
     */
    if (pendingBook) {
      statusText.textContent =
        "先に下のバーコードをスキャンしてください";
      return;
    }

    /*
     * 同じISBNの問い合わせ中なら無視
     */
    if (loadingISBNs.has(isbn)) {
      return;
    }

    loadingISBNs.add(isbn);

    statusText.classList.remove("pending");
    statusText.textContent = "書誌情報を取得しています…";

    try {
      const info = await getBookInfoFromOpenBD(isbn);

      /*
       * openBDからタイトル＋価格が取れた
       *
       * → ここで即確定
       */
      if (
        info &&
        info.title &&
        info.price != null
      ) {

        const added = addBookRecord(
          isbn,
          info.title,
          info.price
        );

        if (added) {
          statusText.textContent =
            info.title +
            " / " +
            info.price.toLocaleString() +
            "円";
        }

        return;
      }


      /*
       * openBDにタイトルだけある場合
       *
       * → タイトルは保持して、
       *    下段JANから価格を取る
       */
      if (info && info.title) {

        pendingBook = {
          isbn: isbn,
          title: info.title
        };

        showPendingMessage();

        return;
      }


      /*
       * openBDに何もない
       *
       * → タイトル不明のまま下段JAN待ち
       */
      pendingBook = {
        isbn: isbn,
        title: "タイトル不明"
      };

      showPendingMessage();

    } finally {
      loadingISBNs.delete(isbn);
    }
  }


  /*
   * ----------------------------------------
   * 下段JANを処理
   * ----------------------------------------
   */

  function handleBookJAN(code) {

    const price = getPriceFromBookJAN(code);

    if (price == null) {
      return;
    }

    /*
     * ISBNが保留されていない状態で
     * 下段JANだけ読んでも追加しない。
     */
    if (!pendingBook) {
      statusText.textContent =
        "ISBNを先にスキャンしてください";
      return;
    }

    const book = pendingBook;

    const added = addBookRecord(
      book.isbn,
      book.title,
      price
    );

    if (added) {

      statusText.classList.remove("pending");

      statusText.textContent =
        book.title +
        " / " +
        price.toLocaleString() +
        "円（下段バーコード）";

      pendingBook = null;
    }
  }


  /*
   * ----------------------------------------
   * カメラから読んだバーコード
   * ----------------------------------------
   */

  function handleBarcode(text) {

    const code = normalizeISBN(text);

    if (!/^\d{13}$/.test(code)) {
      return;
    }

    /*
     * 同じバーコードを連続で拾うのを抑制
     */
    const now = Date.now();

    if (
      code === lastBarcode &&
      now - lastBarcodeTime < 700
    ) {
      return;
    }

    lastBarcode = code;
    lastBarcodeTime = now;


    /*
     * 下段JANを先に判定
     */
    if (isValidBookJANSecondCode(code)) {
      handleBookJAN(code);
      return;
    }


    /*
     * ISBN13
     */
    if (isValidISBN13(code)) {
      handleISBN(code);
      return;
    }
  }


  /*
   * ----------------------------------------
   * カメラ起動
   * ----------------------------------------
   *
   * ここは前に動いていた方式を維持。
   */

  async function startCamera() {

    if (controls) {
      return;
    }

    statusText.classList.remove("pending");
    statusText.textContent =
      "カメラを起動しています…";

    try {

      codeReader =
        new ZXing.BrowserMultiFormatReader();

      const videoInputDevices =
        await codeReader.listVideoInputDevices();

      if (!videoInputDevices.length) {
        throw new Error("カメラが見つかりません");
      }


      let selectedDevice =
        videoInputDevices.find(
          device =>
            /back|rear|environment/i.test(
              device.label
            )
        );


      if (!selectedDevice) {
        selectedDevice =
          videoInputDevices[
            videoInputDevices.length - 1
          ];
      }


      controls =
        await codeReader.decodeFromVideoDevice(
          selectedDevice.deviceId,
          video,
          (result, error) => {

            if (result) {
              handleBarcode(result.getText());
            }

          }
        );


      statusText.textContent =
        "ISBNバーコードを緑枠に合わせてください";

    } catch (error) {

      console.error(error);

      statusText.classList.remove("pending");

      statusText.textContent =
        "カメラを起動できませんでした";
    }
  }


  /*
   * ----------------------------------------
   * カメラ停止
   * ----------------------------------------
   */

  function stopCamera() {

    try {
      if (controls) {
        controls.stop();
      }
    } catch (error) {
      console.error(error);
    }

    controls = null;

    if (codeReader) {
      try {
        codeReader.reset();
      } catch (error) {
        console.error(error);
      }
    }

    codeReader = null;


    try {
      const stream =
        video.srcObject;

      if (stream) {
        stream.getTracks().forEach(
          track => track.stop()
        );
      }

      video.srcObject = null;

    } catch (error) {
      console.error(error);
    }


    pendingBook = null;

    statusText.classList.remove("pending");

    statusText.textContent =
      "カメラを停止しました";
  }


  /*
   * ----------------------------------------
   * 手入力ISBN
   * ----------------------------------------
   */

  async function addManualISBN() {

    const isbn =
      normalizeISBN(isbnInput.value);

    if (!isValidISBN13(isbn)) {
      statusText.textContent =
        "正しいISBN13桁を入力してください";
      return;
    }


    if (loadingISBNs.has(isbn)) {
      return;
    }

    loadingISBNs.add(isbn);

    statusText.classList.remove("pending");
    statusText.textContent =
      "書誌情報を取得しています…";


    try {

      const info =
        await getBookInfoFromOpenBD(isbn);


      if (
        info &&
        info.title &&
        info.price != null
      ) {

        addBookRecord(
          isbn,
          info.title,
          info.price
        );

        statusText.textContent =
          info.title +
          " / " +
          info.price.toLocaleString() +
          "円";

        isbnInput.value = "";

        return;
      }


      /*
       * 手入力の場合は下段JANをカメラで
       * 読ませることができない前提なので、
       * 保留にはせず案内する。
       */
      statusText.textContent =
        "このISBNは価格情報を取得できませんでした。カメラでISBNを読み、下のバーコードをスキャンしてください";

    } finally {

      loadingISBNs.delete(isbn);

    }
  }


  /*
   * ----------------------------------------
   * 取り消し
   * ----------------------------------------
   */

  function undoLastBook() {

    if (!books.length) {
      return;
    }

    const book =
      books.pop();

    totalBooks--;
    totalPrice -= book.price;

    if (priceCounts[book.price]) {
      priceCounts[book.price]--;

      if (priceCounts[book.price] <= 0) {
        delete priceCounts[book.price];
      }
    }

    updateDisplay();

    statusText.textContent =
      "最後の1冊を戻しました";
  }


  /*
   * ----------------------------------------
   * 表示更新
   * ----------------------------------------
   */

  function updateDisplay() {

    totalBooksElement.textContent =
      totalBooks.toLocaleString();

    totalPriceElement.textContent =
      totalPrice.toLocaleString() + "円";


    /*
     * 本一覧
     */
    if (!books.length) {

      bookList.innerHTML =
        '<div class="empty">まだ本がありません</div>';

    } else {

      bookList.innerHTML =
        books
          .slice()
          .reverse()
          .map(book => `
            <div class="book">
              <div class="book-title">
                ${escapeHTML(book.title)}
              </div>

              <div class="book-info">
                ${escapeHTML(book.isbn)}
                ／
                ${book.price.toLocaleString()}円
              </div>
            </div>
          `)
          .join("");
    }


    /*
     * 価格別
     */
    const prices =
      Object.keys(priceCounts)
        .map(Number)
        .sort((a, b) => a - b);


    if (!prices.length) {

      priceList.innerHTML =
        '<div class="empty">まだ本がありません</div>';

    } else {

      priceList.innerHTML =
        prices
          .map(price => `
            <div class="price-row">
              <span>${price.toLocaleString()}円</span>
              <span>${priceCounts[price]}冊</span>
            </div>
          `)
          .join("");
    }
  }


  /*
   * ----------------------------------------
   * HTMLエスケープ
   * ----------------------------------------
   */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /*
   * ----------------------------------------
   * 読み取り音
   * ----------------------------------------
   */

  let audioContext = null;

  function beep() {

    try {

      if (!audioContext) {
        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type = "sine";

      oscillator.frequency.value = 880;

      gain.gain.setValueAtTime(
        0.08,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.08
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + 0.08
      );

    } catch (error) {
      console.error(error);
    }
  }


  /*
   * ----------------------------------------
   * イベント
   * ----------------------------------------
   */

  startButton.addEventListener(
    "click",
    startCamera
  );

  stopButton.addEventListener(
    "click",
    stopCamera
  );

  manualButton.addEventListener(
    "click",
    addManualISBN
  );

  isbnInput.addEventListener(
    "keydown",
    event => {
      if (event.key === "Enter") {
        addManualISBN();
      }
    }
  );

  undoButton.addEventListener(
    "click",
    undoLastBook
  );


  resetButton.addEventListener(
    "click",
    () => {

      if (
        !confirm(
          "すべての記録をリセットしますか？"
        )
      ) {
        return;
      }

      books = [];
      totalBooks = 0;
      totalPrice = 0;
      priceCounts = {};

      pendingBook = null;

      lastBarcode = "";
      lastBarcodeTime = 0;

      statusText.classList.remove("pending");

      statusText.textContent =
        "リセットしました";

      updateDisplay();
    }
  );


  /*
   * 初期表示
   *
   * カメラはここでは起動しない。
   * iPhoneでは「カメラを起動」ボタンを
   * 押したときに起動する。
   */

  updateDisplay();

</script>

</body>
</html>
