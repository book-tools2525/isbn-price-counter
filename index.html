<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISBNカウンター</title>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      margin: 0 0 20px;
    }

    .box {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .box-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #reader {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #video {
      width: 100%;
      display: block;
      background: #000;
    }

    .guide {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 35%;
      height: 30%;
      border: 3px solid #00ff66;
      border-radius: 8px;
      box-sizing: border-box;
      pointer-events: none;
    }

    .guide-text {
      position: absolute;
      left: 0;
      right: 0;
      top: 25%;
      text-align: center;
      color: white;
      font-weight: bold;
      text-shadow: 0 1px 4px black;
      pointer-events: none;
    }

    .status {
      text-align: center;
      font-weight: bold;
      margin: 10px 0;
      min-height: 24px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      background: #333;
      color: white;
    }

    button:active {
      opacity: 0.7;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-top: 8px;
    }

    .totals {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .total-number {
      font-size: 28px;
      font-weight: bold;
    }

    .total-label {
      font-size: 13px;
      color: #666;
      margin-top: 3px;
    }

    .book {
      background: #fafafa;
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #eee;
    }

    .book-title {
      font-weight: bold;
    }

    .book-info {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .price {
      font-weight: bold;
      margin-top: 4px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 4px;
      border-bottom: 1px solid #eee;
    }

    .price-row:last-child {
      border-bottom: none;
    }

    .price-name {
      font-size: 17px;
      font-weight: bold;
    }

    .price-count {
      font-size: 16px;
    }

    .price-subtotal {
      font-weight: bold;
      margin-left: 8px;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 10px 0;
    }

    #undoButton {
      background: #555;
    }

    #resetButton {
      background: #b00020;
    }
  </style>
</head>

<body>

  <h1>ISBNカウンター</h1>


  <!-- カメラ -->

  <div class="box">

    <div class="box-title">カメラ</div>

    <div id="reader">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="guide"></div>

      <div class="guide-text">
        ISBNバーコードを緑枠に合わせてください
      </div>

    </div>

    <div id="status" class="status">
      「カメラを起動」を押してください
    </div>

    <button id="startButton">
      カメラを起動
    </button>

    <button id="stopButton">
      カメラを停止
    </button>

  </div>


  <!-- 手入力 -->

  <div class="box">

    <div class="box-title">手入力</div>

    <input
      id="isbnInput"
      type="text"
      inputmode="numeric"
      placeholder="978xxxxxxxxxx">

    <button id="manualButton">
      ISBNを追加
    </button>

  </div>


  <!-- 金額 -->

  <div class="box">

    <div class="box-title">金額</div>

    <div class="totals">

      <div>
        <div
          class="total-number"
          id="totalBooks">
          0
        </div>

        <div class="total-label">
          冊
        </div>
      </div>

      <div>
        <div class="total-number">
          ¥<span id="totalPrice">0</span>
        </div>

        <div class="total-label">
          合計本体価格
        </div>
      </div>

    </div>

  </div>


  <!-- 1冊戻る -->

  <div class="box">

    <button id="undoButton">
      1冊戻る
    </button>

  </div>


  <!-- 読み取った本の一覧 -->

  <div class="box">

    <div class="box-title">
      読み取った本の一覧
    </div>

    <div id="bookList">

      <div class="empty">
        まだ本がありません
      </div>

    </div>

  </div>


  <!-- 金額別一覧 -->

  <div class="box">

    <div class="box-title">
      読み取った本の金額一覧
    </div>

    <div id="priceList">

      <div class="empty">
        まだ本がありません
      </div>

    </div>

  </div>


  <!-- リセット -->

  <div class="box">

    <button id="resetButton">
      すべてリセット
    </button>

  </div>


<script>

/* =============================
   要素
============================= */

const video =
  document.getElementById("video");

const statusText =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const isbnInput =
  document.getElementById("isbnInput");

const manualButton =
  document.getElementById("manualButton");

const totalBooksElement =
  document.getElementById("totalBooks");

const totalPriceElement =
  document.getElementById("totalPrice");

const bookList =
  document.getElementById("bookList");

const priceList =
  document.getElementById("priceList");

const undoButton =
  document.getElementById("undoButton");

const resetButton =
  document.getElementById("resetButton");


/* =============================
   データ
============================= */

let codeReader = null;
let controls = null;

let totalBooks = 0;
let totalPrice = 0;

let priceCounts = {};
let books = [];

let lastISBN = "";


/*
  上段・下段バーコードの
  一時保存
*/

let pendingISBN = "";
let pendingPrice = null;

let pendingTimer = null;


/*
  同じバーコードを何度も読むのを防止
*/

let lastDetectedCode = "";
let lastDetectedTime = 0;


/*
  本ごとのタイトル取得を
  複数同時に行うため、
  processingロックは使わない。
*/


/* =============================
   ビープ音
============================= */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.frequency.value =
      1000;

    oscillator.type =
      "sine";

    gain.gain.value =
      0.15;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    setTimeout(() => {

      oscillator.stop();

      audioContext.close();

    }, 80);

  } catch (e) {

    console.log(
      "beep error",
      e
    );

  }

}


/* =============================
   ISBN整形
============================= */

function normalizeISBN(value) {

  return String(value || "")
    .replace(/[^0-9]/g, "");

}


/* =============================
   ISBN-13チェック
============================= */

function isValidISBN13(isbn) {

  isbn =
    normalizeISBN(isbn);

  if (
    !/^(978|979)\d{10}$/.test(isbn)
  ) {

    return false;

  }

  let sum = 0;

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    const digit =
      Number(isbn[i]);

    sum +=
      i % 2 === 0
        ? digit
        : digit * 3;

  }

  const checkDigit =
    (10 - (sum % 10)) % 10;

  return (
    checkDigit ===
    Number(isbn[12])
  );

}


/* =============================
   下段書籍JANチェック
============================= */

function isValidBookJANSecondCode(code) {

  code =
    normalizeISBN(code);

  if (
    !/^192\d{10}$/.test(code)
  ) {

    return false;

  }

  let sum = 0;

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    const digit =
      Number(code[i]);

    sum +=
      i % 2 === 0
        ? digit
        : digit * 3;

  }

  const checkDigit =
    (10 - (sum % 10)) % 10;

  return (
    checkDigit ===
    Number(code[12])
  );

}


/* =============================
   下段JAN → 本体価格
============================= */

function getPriceFromBookJAN(code) {

  code =
    normalizeISBN(code);

  if (
    !isValidBookJANSecondCode(code)
  ) {

    return null;

  }


  /*
    192
    Cコード4桁
    本体価格5桁
    チェック1桁
  */

  const priceText =
    code.substring(7, 12);

  const price =
    Number(priceText);

  if (
    !Number.isFinite(price) ||
    price <= 0
  ) {

    return null;

  }

  return price;

}


/* =============================
   openBDからタイトル取得
============================= */

async function getTitleFromOpenBD(isbn) {

  const url =
    "https://api.openbd.jp/v1/get?isbn=" +
    encodeURIComponent(isbn);


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "openBD error"
    );

  }


  const data =
    await response.json();


  if (
    !data ||
    !data[0]
  ) {

    return null;

  }


  const book =
    data[0];

  const summary =
    book.summary || {};


  return (
    summary.title ||
    null
  );

}


/* =============================
   下段価格＋上段ISBNが揃ったら
   すぐ本を追加
============================= */

function scheduleCameraAdd() {

  /*
    すでに両方あるなら
    待つ必要なし。
  */

  if (
    pendingISBN &&
    pendingPrice !== null
  ) {

    const isbn =
      pendingISBN;

    const price =
      pendingPrice;


    pendingISBN = "";

    pendingPrice = null;


    if (pendingTimer) {

      clearTimeout(
        pendingTimer
      );

      pendingTimer = null;

    }


    addBookFromBarcode(
      isbn,
      price
    );

    return;

  }


  /*
    ISBNだけ先に読めた場合。

    下段が読めなかったとしても、
    少し待ってからISBNだけで処理。
  */

  if (
    pendingISBN
  ) {

    if (pendingTimer) {

      clearTimeout(
        pendingTimer
      );

    }


    pendingTimer =
      setTimeout(() => {

        const isbn =
          pendingISBN;

        const price =
          pendingPrice;


        pendingISBN = "";

        pendingPrice = null;

        pendingTimer = null;


        /*
          priceがnullなら
          openBD価格を使う。
        */

        addBookFromBarcode(
          isbn,
          price
        );

      }, 500);

  }

}


/* =============================
   バーコード検出
============================= */

function handleBarcode(text) {

  const code =
    normalizeISBN(text);


  if (
    code.length !== 13
  ) {

    return;

  }


  /*
    同じバーコードを
    短時間に何度も検出しない
  */

  const now =
    Date.now();


  if (
    code === lastDetectedCode &&
    now - lastDetectedTime < 500
  ) {

    return;

  }


  lastDetectedCode =
    code;

  lastDetectedTime =
    now;


  /*
    下段JANを最優先
  */

  if (
    isValidBookJANSecondCode(code)
  ) {

    const price =
      getPriceFromBookJAN(code);


    if (
      price !== null
    ) {

      /*
        価格を即確定
      */

      pendingPrice =
        price;


      /*
        ISBNがすでにあれば
        即追加
      */

      if (
        pendingISBN
      ) {

        scheduleCameraAdd();

      }

    }

    return;

  }


  /*
    上段ISBN
  */

  if (
    isValidISBN13(code)
  ) {

    pendingISBN =
      code;


    /*
      下段価格がすでに読めていれば
      即追加。
    */

    if (
      pendingPrice !== null
    ) {

      scheduleCameraAdd();

    } else {

      /*
        下段を待つ
      */

      scheduleCameraAdd();

    }

    return;

  }

}


/* =============================
   バーコードから本を追加
============================= */

function addBookFromBarcode(
  isbn,
  barcodePrice
) {

  isbn =
    normalizeISBN(isbn);


  if (
    !isValidISBN13(isbn)
  ) {

    return;

  }


  /*
    直前と同じISBNなら無視
  */

  if (
    isbn === lastISBN
  ) {

    statusText.textContent =
      "⚠️ 直前と同じ本です。追加していません";

    return;

  }


  /*
    価格バーコードが読めていれば
    価格はこの時点ですでに確定。
    
    ここではタイトル取得を待たない。
  */

  if (
    barcodePrice !== null &&
    barcodePrice !== undefined
  ) {

    addBookImmediately(
      isbn,
      barcodePrice
    );

    return;

  }


  /*
    下段が読めなかった場合だけ
    openBDからタイトル＋価格を取得。
  */

  addBookFromOpenBD(
    isbn
  );

}


/* =============================
   価格確定済みの本を即追加
============================= */

function addBookImmediately(
  isbn,
  price
) {

  /*
    直前の本と同じISBNなら無視
  */

  if (
    isbn === lastISBN
  ) {

    statusText.textContent =
      "⚠️ 直前と同じ本です。追加していません";

    return;

  }


  const book = {

    isbn: isbn,

    title: "タイトル不明",

    price: price

  };


  books.push(book);


  totalBooks++;

  totalPrice +=
    price;


  if (
    priceCounts[price] === undefined
  ) {

    priceCounts[price] = 0;

  }

  priceCounts[price]++;


  lastISBN =
    isbn;


  updateDisplay();

  beep();


  /*
    価格が確定した時点で
    すぐ画面に反映。
  */

  statusText.textContent =
    `タイトル取得中（本体価格¥${price.toLocaleString()}）`;


  /*
    ここからタイトルだけ取得。
    
    失敗しても
    「タイトル不明」のまま本は残る。
  */

  getTitleFromOpenBD(isbn)

    .then(title => {

      if (
        title
      ) {

        /*
          ISBNを使って
          今追加した本を探す。
        */

        const target =
          books.find(
            book =>
              book.isbn === isbn &&
              book.title === "タイトル不明"
          );


        if (
          target
        ) {

          target.title =
            title;

          updateBookList();

        }


        statusText.textContent =
          `${title}（本体価格¥${price.toLocaleString()}・バーコードから取得）を追加しました`;

      } else {

        statusText.textContent =
          `タイトル不明（本体価格¥${price.toLocaleString()}・バーコードから取得）を追加しました`;

      }

    })

    .catch(error => {

      console.log(
        "タイトル取得失敗:",
        error
      );


      statusText.textContent =
        `タイトル不明（本体価格¥${price.toLocaleString()}・バーコードから取得）を追加しました`;

    });

}


/* =============================
   下段が読めなかった場合
============================= */

async function addBookFromOpenBD(
  isbn
) {

  if (
    isbn === lastISBN
  ) {

    statusText.textContent =
      "⚠️ 直前と同じ本です。追加していません";

    return;

  }


  statusText.textContent =
    "価格情報を取得しています…";


  try {

    const url =
      "https://api.openbd.jp/v1/get?isbn=" +
      encodeURIComponent(isbn);


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "openBD error"
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !data[0]
    ) {

      throw new Error(
        "情報なし"
      );

    }


    const book =
      data[0];


    const title =
      book.summary &&
      book.summary.title
        ? book.summary.title
        : "タイトル不明";


    let price =
      null;


    try {

      const prices =
        book
          .onix
          .ProductSupply
          .SupplyDetail
          .Price;


      if (
        Array.isArray(prices)
      ) {

        for (
          const p of prices
        ) {

          const amount =
            Number(
              p.PriceAmount
            );


          if (
            amount > 0
          ) {

            price =
              amount;

            break;

          }

        }

      }

    } catch (e) {

      console.log(
        "openBD価格取得エラー",
        e
      );

    }


    if (
      price === null
    ) {

      statusText.textContent =
        `${title}：価格を取得できませんでした`;

      return;

    }


    addBookRecord(
      isbn,
      title,
      price
    );


    statusText.textContent =
      `${title}（本体価格¥${price.toLocaleString()}）を追加しました`;


  } catch (error) {

    console.log(
      "openBD取得失敗:",
      error
    );


    statusText.textContent =
      "この本の価格情報を取得できませんでした";

  }

}


/* =============================
   本を記録
============================= */

function addBookRecord(
  isbn,
  title,
  price
) {

  if (
    isbn === lastISBN
  ) {

    return;

  }


  const book = {

    isbn: isbn,

    title: title,

    price: price

  };


  books.push(book);


  totalBooks++;

  totalPrice +=
    price;


  if (
    priceCounts[price] === undefined
  ) {

    priceCounts[price] = 0;

  }

  priceCounts[price]++;


  lastISBN =
    isbn;


  updateDisplay();

  beep();

}


/* =============================
   本一覧更新
============================= */

function updateBookList() {

  bookList.innerHTML = "";


  if (
    books.length === 0
  ) {

    bookList.innerHTML = `
      <div class="empty">
        まだ本がありません
      </div>
    `;

    return;

  }


  for (
    let i = books.length - 1;
    i >= 0;
    i--
  ) {

    const book =
      books[i];


    const bookElement =
      document.createElement("div");


    bookElement.className =
      "book";


    bookElement.innerHTML = `

      <div class="book-title">
        ${escapeHTML(book.title)}
      </div>

      <div class="book-info">
        ISBN: ${book.isbn}
      </div>

      <div class="price">
        本体価格
        ¥${book.price.toLocaleString()}
      </div>

    `;


    bookList.appendChild(
      bookElement
    );

  }

}


/* =============================
   金額一覧更新
============================= */

function updatePriceList() {

  priceList.innerHTML = "";


  if (
    Object.keys(priceCounts).length === 0
  ) {

    priceList.innerHTML = `
      <div class="empty">
        まだ本がありません
      </div>
    `;

    return;

  }


  const prices =
    Object.keys(priceCounts)
      .map(Number)
      .sort(
        (a, b) => b - a
      );


  for (
    const price of prices
  ) {

    const count =
      priceCounts[price];


    const subtotal =
      price * count;


    const row =
      document.createElement("div");


    row.className =
      "price-row";


    row.innerHTML = `

      <div class="price-name">
        ¥${price.toLocaleString()}
      </div>

      <div class="price-count">
        ${count.toLocaleString()}冊

        <span class="price-subtotal">
          ¥${subtotal.toLocaleString()}
        </span>
      </div>

    `;


    priceList.appendChild(row);

  }

}


/* =============================
   表示更新
============================= */

function updateDisplay() {

  totalBooksElement.textContent =
    totalBooks.toLocaleString();


  totalPriceElement.textContent =
    totalPrice.toLocaleString();


  updateBookList();

  updatePriceList();

}


/* =============================
   HTMLエスケープ
============================= */

function escapeHTML(text) {

  const div =
    document.createElement("div");


  div.textContent =
    text;


  return div.innerHTML;

}


/* =============================
   1冊戻る
============================= */

function undoLastBook() {

  if (
    books.length === 0
  ) {

    statusText.textContent =
      "戻せる本がありません";

    return;

  }


  const removedBook =
    books.pop();


  totalBooks--;

  totalPrice -=
    removedBook.price;


  priceCounts[
    removedBook.price
  ]--;


  if (
    priceCounts[
      removedBook.price
    ] <= 0
  ) {

    delete priceCounts[
      removedBook.price
    ];

  }


  if (
    books.length > 0
  ) {

    lastISBN =
      books[
        books.length - 1
      ].isbn;

  } else {

    lastISBN = "";

  }


  updateDisplay();


  statusText.textContent =
    `${removedBook.title} を1冊取り消しました`;

}


/* =============================
   カメラ開始
============================= */

async function startCamera() {

  /*
    すでに起動中なら何もしない
  */

  if (
    controls
  ) {

    return;

  }


  statusText.textContent =
    "カメラを起動しています…";


  try {

    /*
      ここは「動いていたコード」と
      同じ方式を使用。
    */

    codeReader =
      new ZXing.BrowserMultiFormatReader();


    const videoInputDevices =
      await codeReader
        .listVideoInputDevices();


    if (
      !videoInputDevices.length
    ) {

      throw new Error(
        "カメラが見つかりません"
      );

    }


    /*
      背面カメラを探す
    */

    let selectedDevice =
      videoInputDevices.find(
        device =>
          /back|rear|environment|背面/i.test(
            device.label
          )
      );


    /*
      見つからなければ
      最後のカメラを使用
    */

    if (
      !selectedDevice
    ) {

      selectedDevice =
        videoInputDevices[
          videoInputDevices.length - 1
        ];

    }


    console.log(
      "使用カメラ:",
      selectedDevice.label
    );


    /*
      動いていたコードと同じく
      video要素を直接渡す。
    */

    controls =
      await codeReader
        .decodeFromVideoDevice(

          selectedDevice.deviceId,

          video,

          (result, error) => {

            if (
              result
            ) {

              const text =
                result.getText();


              console.log(
                "Barcode detected:",
                text
              );


              handleBarcode(
                text
              );

            }

          }

        );


    statusText.textContent =
      "ISBNバーコードを緑枠に合わせてください";


  } catch (error) {

    console.error(
      "カメラ起動エラー:",
      error
    );


    statusText.textContent =
      "カメラを起動できませんでした";

  }

}


/* =============================
   カメラ停止
============================= */

function stopCamera() {

  if (
    controls
  ) {

    controls.stop();

    controls = null;

  }


  if (
    codeReader
  ) {

    try {

      codeReader.reset();

    } catch (e) {}

  }


  if (
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    video.srcObject = null;

  }


  pendingISBN = "";

  pendingPrice = null;


  if (
    pendingTimer
  ) {

    clearTimeout(
      pendingTimer
    );

    pendingTimer = null;

  }


  statusText.textContent =
    "カメラを停止しました";

}


/* =============================
   手入力
============================= */

manualButton.addEventListener(
  "click",
  () => {

    const isbn =
      normalizeISBN(
        isbnInput.value
      );


    if (
      !isValidISBN13(isbn)
    ) {

      statusText.textContent =
        "ISBN-13として認識できませんでした";

      return;

    }


    isbnInput.value = "";


    addBookFromOpenBD(
      isbn
    );

  }
);


isbnInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      manualButton.click();

    }

  }
);


/* =============================
   カメラボタン
============================= */

startButton.addEventListener(
  "click",
  startCamera
);


stopButton.addEventListener(
  "click",
  stopCamera
);


/* =============================
   1冊戻る
============================= */

undoButton.addEventListener(
  "click",
  undoLastBook
);


/* =============================
   リセット
============================= */

resetButton.addEventListener(
  "click",
  () => {

    if (
      !confirm(
        "冊数・合計金額・読み取り履歴をすべてリセットしますか？"
      )
    ) {

      return;

    }


    totalBooks = 0;

    totalPrice = 0;

    priceCounts = {};

    books = [];

    lastISBN = "";

    pendingISBN = "";

    pendingPrice = null;


    if (
      pendingTimer
    ) {

      clearTimeout(
        pendingTimer
      );

      pendingTimer = null;

    }


    updateDisplay();


    isbnInput.value = "";


    statusText.textContent =
      "リセットしました";

  }
);


/* =============================
   初期表示
============================= */

updateDisplay();

</script>
