<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISBN・JANプライスカウンター</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .mode-switch { display: flex; gap: 8px; margin-bottom: 15px; }
    .mode-switch button { flex: 1; background: #e4e4e4; color: #333; border: 2px solid transparent; font-weight: bold; }
    .mode-switch button.active { background: #245f9d; color: white; border-color: #17456f; }
    .camera-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #reader {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    #video {
      width: 100%;
      display: block;
    }

    .guide {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 40%;
      height: 20%;
      border: 2px solid #00ff66;
      box-sizing: border-box;
      pointer-events: none;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button:active {
      opacity: 0.7;
    }

    .camera-button {
      width: 100%;
      margin-top: 10px;
    }

    .manual {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    .manual-row input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .status {
      text-align: center;
      min-height: 24px;
      margin: 12px 0;
      font-size: 15px;
    }

    .status.error {
      color: #d00;
      font-weight: bold;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .summary-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .summary-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .actions button {
      flex: 1;
    }

    .books,
    .prices {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .books h2,
    .prices h2 {
      font-size: 18px;
      margin-top: 0;
    }

    .book-item,
    .price-item {
      border-top: 1px solid #eee;
      padding: 10px 0;
    }

    .book-item:first-child,
    .price-item:first-child {
      border-top: none;
    }

    .book-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .book-meta {
      font-size: 13px;
      color: #666;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>プライスカウンター</h1>

  <div class="mode-switch" aria-label="読み取りモード">
    <button id="isbnModeButton" class="active" type="button" aria-pressed="true">ISBNモード</button>
    <button id="janModeButton" type="button" aria-pressed="false">JANモード</button>
  </div>

  <div class="camera-box">

    <div id="reader">
      <video id="video" autoplay playsinline muted></video>
      <div class="guide"></div>
    </div>

    <button id="startCameraButton" class="camera-button">
      カメラを起動
    </button>

  </div>

  <div id="statusText" class="status">
    カメラを起動してください
  </div>

  <div class="manual">

    <div class="manual-row">
      <input
        id="isbnInput"
        type="text"
        inputmode="numeric"
        placeholder="ISBN13桁を入力"
      >

      <button id="manualButton">
        追加
      </button>
    </div>

  </div>

  <div class="summary">

    <div class="summary-box">
      <div class="summary-label">
        合計冊数
      </div>

      <div id="totalBooks" class="summary-value">
        0
      </div>
    </div>

    <div class="summary-box">
      <div class="summary-label">
        合計本体価格
      </div>

      <div id="totalPrice" class="summary-value">
        0円
      </div>
    </div>

  </div>

  <div class="actions">

    <button id="undoButton">
      1冊戻す
    </button>

    <button id="resetButton">
      リセット
    </button>

  </div>

  <div class="books">

    <h2>登録した本</h2>

    <div id="bookList">
      <div class="empty">
        まだ本がありません
      </div>
    </div>

  </div>

  <div class="prices">

    <h2>価格別集計</h2>

    <div id="priceList">
      <div class="empty">
        まだ本がありません
      </div>
    </div>

  </div>

</div>

<script>

let codeReader = null;
let controls = null;

let currentMode = "isbn";
// モード別に集計を保存し、切り替えても混ざらないようにする。
const modeRecords = { isbn: [], jan: [] };
let books = modeRecords.isbn;
let lastJAN = "";
let processingModeToken = 0;
let totalBooks = 0;
let totalPrice = 0;
let priceCounts = {};

let lastISBN = "";
let processingISBN = "";

/*
 * ISBNの情報取得に失敗して、
 * 下段JANを待っている状態かどうか
 */
let waitingForSecondJAN = false;

/*
 * 現在、下段JANを待っている
 * 「直前のISBN」
 *
 * JANから登録するとき、
 * このISBNを本の一覧に保存する。
 */
let waitingISBN = "";

const isbnModeButton = document.getElementById("isbnModeButton");
const janModeButton = document.getElementById("janModeButton");
const bookHeading = document.querySelector(".books h2");

function setMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;
  processingModeToken++;
  books = modeRecords[mode];
  lastISBN = "";
  lastJAN = "";
  processingISBN = "";
  waitingForSecondJAN = false;
  waitingISBN = "";
  isbnInput.value = "";
  isbnInput.placeholder = mode === "jan" ? "下段JAN13桁を入力" : "ISBN13桁を入力";
  bookHeading.textContent = mode === "jan" ? "登録した金額" : "登録した本";
  isbnModeButton.classList.toggle("active", mode === "isbn");
  janModeButton.classList.toggle("active", mode === "jan");
  isbnModeButton.setAttribute("aria-pressed", String(mode === "isbn"));
  janModeButton.setAttribute("aria-pressed", String(mode === "jan"));
  statusText.classList.remove("error");
  statusText.textContent = mode === "jan"
    ? "下段の価格バーコード（192で始まる13桁）を読み取ってください"
    : "ISBNバーコードを緑枠に合わせてください";
  updateDisplay();
}

const video =
  document.getElementById("video");

const statusText =
  document.getElementById("statusText");

const isbnInput =
  document.getElementById("isbnInput");

const totalBooksElement =
  document.getElementById("totalBooks");

const totalPriceElement =
  document.getElementById("totalPrice");

const bookList =
  document.getElementById("bookList");

const priceList =
  document.getElementById("priceList");

const startCameraButton =
  document.getElementById("startCameraButton");

const manualButton =
  document.getElementById("manualButton");

const undoButton =
  document.getElementById("undoButton");

const resetButton =
  document.getElementById("resetButton");


/*
 * カメラ起動
 *
 * 現在動作している実装をそのまま維持。
 */
async function startCamera() {

  if (controls) {
    return;
  }

  statusText.textContent =
    "カメラを起動しています…";

  try {

    codeReader =
      new ZXing.BrowserMultiFormatReader();

    const videoInputDevices =
      await codeReader.listVideoInputDevices();

    if (!videoInputDevices.length) {
      throw new Error("カメラが見つかりません");
    }

    let selectedDevice =
      videoInputDevices.find(
        device =>
          /back|rear|environment/i.test(
            device.label
          )
      );

    if (!selectedDevice) {
      selectedDevice =
        videoInputDevices[
          videoInputDevices.length - 1
        ];
    }

    controls =
      await codeReader.decodeFromVideoDevice(
        selectedDevice.deviceId,
        video,
        (result, error) => {

          if (result) {
            handleBarcode(
              result.getText()
            );
          }

        }
      );

    statusText.textContent =
      currentMode === "jan" ? "下段の価格バーコードを緑枠に合わせてください" : "ISBNバーコードを緑枠に合わせてください";

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "カメラを起動できませんでした";

  }
}


/*
 * ISBN/JANの文字列を整形
 */
function normalizeISBN(text) {

  return String(text || "")
    .replace(/[^0-9]/g, "");

}


/*
 * ISBN13チェック
 */
function isValidISBN13(code) {

  if (!/^\d{13}$/.test(code)) {
    return false;
  }

  if (
    !code.startsWith("978") &&
    !code.startsWith("979")
  ) {
    return false;
  }

  let sum = 0;

  for (let i = 0; i < 12; i++) {

    const digit =
      Number(code[i]);

    if (i % 2 === 0) {
      sum += digit;
    } else {
      sum += digit * 3;
    }

  }

  const check =
    (10 - (sum % 10)) % 10;

  return (
    check === Number(code[12])
  );

}


/*
 * 下段JANチェック
 */
function isValidBookJANSecondCode(code) {

  if (!/^\d{13}$/.test(code)) {
    return false;
  }

  if (!code.startsWith("192")) {
    return false;
  }

  let sum = 0;

  for (let i = 0; i < 12; i++) {

    const digit =
      Number(code[i]);

    if (i % 2 === 0) {
      sum += digit;
    } else {
      sum += digit * 3;
    }

  }

  const check =
    (10 - (sum % 10)) % 10;

  return (
    check === Number(code[12])
  );

}


/*
 * 下段JANから本体価格を取り出す
 */
function getPriceFromBookJAN(code) {

  if (!isValidBookJANSecondCode(code)) {
    return null;
  }

  const priceText =
    code.substring(7, 12);

  const price =
    Number(priceText);

  if (
    !Number.isFinite(price) ||
    price <= 0
  ) {
    return null;
  }

  return price;

}


/*
 * openBDから書誌情報を取得
 */
async function getBookInfoFromOpenBD(isbn) {

  try {

    const response =
      await fetch(
        "https://api.openbd.jp/v1/get?isbn=" +
        encodeURIComponent(isbn)
      );

    if (!response.ok) {
      return null;
    }

    const data =
      await response.json();

    const item =
      data && data[0];

    if (!item) {
      return null;
    }

    let title =
      item?.summary?.title ||
      null;

    if (!title) {

      title =
        item?.onix
          ?.DescriptiveDetail
          ?.TitleDetail
          ?.TitleElement?.[0]
          ?.TitleText
          ?.content ||
        null;

    }

    const prices =
      item?.onix
        ?.ProductSupply
        ?.SupplyDetail
        ?.Price ||
      [];

    let priceInfo =
      prices.find(
        price =>
          price.PriceType === "01"
      );

    if (!priceInfo) {

      priceInfo =
        prices.find(
          price =>
            price.PriceType === "02"
        );

    }

    if (
      !priceInfo &&
      prices.length > 0
    ) {

      priceInfo =
        prices[0];

    }

    let price = null;

    if (
      priceInfo?.PriceAmount != null
    ) {

      const parsed =
        Number(
          priceInfo.PriceAmount
        );

      if (
        Number.isFinite(parsed) &&
        parsed > 0
      ) {

        price = parsed;

      }

    }

    if (
      !title &&
      price == null
    ) {

      return null;

    }

    return {
      title: title,
      price: price
    };

  } catch (error) {

    console.error(
      "openBD error:",
      error
    );

    return null;

  }

}


/*
 * 本を登録
 *
 * ISBNは空でもOK。
 */
function addBookRecord(
  isbn,
  title,
  price
) {

  if (price == null) {
    return false;
  }

  price =
    Number(price);

  if (
    !Number.isFinite(price) ||
    price <= 0
  ) {
    return false;
  }

  const book = {

    isbn:
      isbn || "",

    title:
      title || "タイトル不明",

    price:
      price

  };

  books.push(book);

  totalBooks++;

  totalPrice += price;

  if (!priceCounts[price]) {
    priceCounts[price] = 0;
  }

  priceCounts[price]++;

  updateDisplay();

  beep();

  return true;

}


/*
 * ISBN処理
 */
async function handleISBN(isbn) {
  const token = processingModeToken;

  /*
   * 下段JAN待ち中はISBNを受け付けない。
   */
  if (waitingForSecondJAN) {
    return;
  }

  /*
   * 同じISBNの問い合わせ中なら無視。
   */
  if (processingISBN === isbn) {
    return;
  }

  /*
   * 同じISBNが連続して映った場合。
   */
  if (lastISBN === isbn) {

    statusText.classList.add(
      "error"
    );

    statusText.textContent =
      "⚠️ 同じISBNが連続しています";

    return;

  }

  processingISBN = isbn;

  statusText.classList.remove(
    "error"
  );

  statusText.textContent =
    "書誌情報を取得しています…";

  const info =
    await getBookInfoFromOpenBD(
      isbn
    );

  if (token !== processingModeToken || currentMode !== "isbn") return;
  processingISBN = "";

  /*
   * タイトル＋価格が両方取れた
   *
   * → 即登録
   */
  if (
    info &&
    info.title &&
    info.price != null
  ) {

    const added =
      addBookRecord(
        isbn,
        info.title,
        info.price
      );

    if (added) {

      lastISBN = isbn;

      waitingForSecondJAN = false;

      /*
       * 念のため待機ISBNも消す。
       */
      waitingISBN = "";

      statusText.classList.remove(
        "error"
      );

      statusText.textContent =
        info.title +
        " / " +
        info.price.toLocaleString() +
        "円";

    }

    return;
  }

  /*
   * ISBN失敗。
   *
   * このISBNを覚えておく。
   */
  waitingForSecondJAN = true;

  waitingISBN = isbn;

  statusText.classList.add(
    "error"
  );

  if (
    info &&
    info.title
  ) {

    statusText.textContent =
      info.title +
      "：価格情報が見つかりません。下のバーコードをスキャンしてください";

  } else {

    statusText.textContent =
      "このISBNの情報が見つかりません。下のバーコードをスキャンしてください";

  }

}


/*
 * 下段JAN処理
 */
function handleBookJAN(code) {

  const price =
    getPriceFromBookJAN(code);

  if (price == null) {
    return;
  }

  /*
   * ISBN失敗後に保存しておいたISBNを使う。
   */
  const isbn =
    waitingISBN;

  const added =
    addBookRecord(
      isbn,
      "タイトル不明",
      price
    );

  if (added) {

    /*
     * 1回登録したら即座に待機解除。
     *
     * 同じJANがカメラに映り続けても
     * 2冊目以降は登録されない。
     */
    waitingForSecondJAN = false;

    waitingISBN = "";

    statusText.classList.remove(
      "error"
    );

    statusText.textContent =
      "タイトル不明 / " +
      price.toLocaleString() +
      "円（下段バーコード）";

  }

}


/*
 * バーコード処理
 */
function handleBarcode(text) {
  if (currentMode === "jan") {
    const jan = normalizeISBN(text);
    handleJANOnly(jan);
    return;
  }

  const code =
    normalizeISBN(text);

  if (!/^\d{13}$/.test(code)) {
    return;
  }

  /*
   * ============================
   * 下段JAN
   * ============================
   *
   * ISBNの情報取得に失敗して
   * 下段JANを待っているときだけ
   * 受け付ける。
   */
  if (
    isValidBookJANSecondCode(code)
  ) {

    /*
     * 普通の状態で下段JANが
     * 読み取られても完全に無視。
     */
    if (!waitingForSecondJAN) {
      return;
    }

    handleBookJAN(code);

    return;
  }

  /*
   * ============================
   * 下段JAN待ち中
   * ============================
   *
   * 別のISBNやその他のコードを
   * 無視する。
   */
  if (waitingForSecondJAN) {
    return;
  }

  /*
   * ============================
   * ISBN
   * ============================
   */
  if (isValidISBN13(code)) {

    handleISBN(code);

    return;
  }

}


/*
 * JAN専用モード：下段の価格バーコードだけで集計する。
 * 同じJANの連続登録を防止（同額をもう1冊登録する場合は
 * ほかの金額を挟むか「1冊戻す」後に再読取）。
 */
function handleJANOnly(code) {
  if (currentMode !== "jan") return;
  const price = getPriceFromBookJAN(code);
  if (price == null) return;
  if (lastJAN === code) {
    statusText.classList.add("error");
    statusText.textContent = "⚠️ 同じJANが連続しています";
    return;
  }
  if (addBookRecord("", "", price)) {
    lastJAN = code;
    statusText.classList.remove("error");
    statusText.textContent = price.toLocaleString() + "円を登録しました";
  }
}

/*
 * 手入力ISBN
 */
async function addManualISBN() {
  if (currentMode === "jan") {
    const jan = normalizeISBN(isbnInput.value);
    if (!isValidBookJANSecondCode(jan) || getPriceFromBookJAN(jan) == null) {
      statusText.classList.add("error");
      statusText.textContent = "⚠️ 192で始まる正しい下段JAN13桁を入力してください";
      return;
    }
    handleJANOnly(jan);
    isbnInput.value = "";
    return;
  }
  const token = processingModeToken;

  const isbn =
    normalizeISBN(
      isbnInput.value
    );

  if (!isValidISBN13(isbn)) {

    statusText.classList.add(
      "error"
    );

    statusText.textContent =
      "⚠️ 正しいISBN13桁を入力してください";

    return;
  }

  /*
   * 下段JAN待ち中は
   * 手入力ISBNも受け付けない。
   */
  if (waitingForSecondJAN) {

    statusText.classList.add(
      "error"
    );

    statusText.textContent =
      "下のバーコードをスキャンしてください";

    return;
  }

  /*
   * 同じISBNを問い合わせ中なら無視。
   */
  if (processingISBN === isbn) {
    return;
  }

  /*
   * 同じISBNを連続入力した場合。
   */
  if (lastISBN === isbn) {

    statusText.classList.add(
      "error"
    );

    statusText.textContent =
      "⚠️ 同じISBNが連続しています";

    return;
  }

  processingISBN = isbn;

  statusText.classList.remove(
    "error"
  );

  statusText.textContent =
    "書誌情報を取得しています…";

  const info =
    await getBookInfoFromOpenBD(
      isbn
    );

  if (token !== processingModeToken || currentMode !== "isbn") return;
  processingISBN = "";

  /*
   * タイトル＋価格あり
   */
  if (
    info &&
    info.title &&
    info.price != null
  ) {

    const added =
      addBookRecord(
        isbn,
        info.title,
        info.price
      );

    if (added) {

      lastISBN = isbn;

      waitingForSecondJAN = false;

      waitingISBN = "";

      statusText.classList.remove(
        "error"
      );

      statusText.textContent =
        info.title +
        " / " +
        info.price.toLocaleString() +
        "円";

      isbnInput.value = "";

    }

    return;
  }

  /*
   * ISBN失敗。
   *
   * このISBNを覚えておいて、
   * 下段JANとセットで登録する。
   */
  waitingForSecondJAN = true;

  waitingISBN = isbn;

  statusText.classList.add(
    "error"
  );

  if (
    info &&
    info.title
  ) {

    statusText.textContent =
      info.title +
      "：価格情報が見つかりません。下のバーコードをスキャンしてください";

  } else {

    statusText.textContent =
      "このISBNの情報が見つかりません。下のバーコードをスキャンしてください";

  }

}


/*
 * 直前の本を削除
 */
function undoLastBook() {

  if (!books.length) {
    return;
  }

  const book =
    books.pop();
  if (currentMode === "jan") lastJAN = "";
  else lastISBN = "";

  totalBooks--;

  totalPrice -=
    book.price;

  if (priceCounts[book.price]) {

    priceCounts[book.price]--;

    if (
      priceCounts[book.price] <= 0
    ) {

      delete priceCounts[
        book.price
      ];

    }

  }

  updateDisplay();

  statusText.classList.remove(
    "error"
  );

  statusText.textContent =
    "1冊戻しました";

}


/*
 * 表示更新
 */
function updateDisplay() {
  totalBooks = books.length;
  totalPrice = books.reduce((sum, book) => sum + book.price, 0);
  priceCounts = {};
  for (const book of books) priceCounts[book.price] = (priceCounts[book.price] || 0) + 1;

  totalBooksElement.textContent =
    totalBooks.toLocaleString();

  totalPriceElement.textContent =
    totalPrice.toLocaleString() +
    "円";


  /* 本一覧：JANモードでは金額だけを表示する。 */
  if (!books.length) {
    bookList.innerHTML = '<div class="empty">まだ登録がありません</div>';
  } else if (currentMode === "jan") {
    bookList.innerHTML = books.map(book =>
      '<div class="book-item"><div class="book-title">' +
      book.price.toLocaleString() + '円</div></div>'
    ).join("");
  } else {
    bookList.innerHTML = books.map(book => {
      const isbnText = book.isbn || "ISBNなし";
      return '<div class="book-item"><div class="book-title">' +
        escapeHTML(book.title) + '</div><div class="book-meta">' +
        isbnText + ' / ' + book.price.toLocaleString() + '円</div></div>';
    }).join("");
  }

  /*
   * 価格別集計
   */
  const priceEntries =
    Object.entries(priceCounts)
      .sort(
        (a, b) =>
          Number(a[0]) -
          Number(b[0])
      );

  if (!priceEntries.length) {

    priceList.innerHTML =
      '<div class="empty">まだ本がありません</div>';

  } else {

    priceList.innerHTML =
      priceEntries
        .map(
          ([price, count]) => {

            return `
              <div class="price-item">

                <div class="price-row">

                  <span>
                    ${Number(price).toLocaleString()}円
                  </span>

                  <strong>
                    ${count}冊
                  </strong>

                </div>

              </div>
            `;

          }
        )
        .join("");

  }

}


/*
 * HTMLエスケープ
 */
function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/*
 * 読み取り成功時の音
 */
function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.frequency.value =
      880;

    gain.gain.value =
      0.1;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      0.08
    );

  } catch (error) {

    console.error(
      "beep error:",
      error
    );

  }

}


/*
 * リセット
 */
function resetAll() {

  modeRecords[currentMode] = [];
  books = modeRecords[currentMode];
  lastJAN = "";

  totalBooks = 0;

  totalPrice = 0;

  priceCounts = {};

  lastISBN = "";

  processingISBN = "";

  waitingForSecondJAN = false;

  waitingISBN = "";

  statusText.classList.remove(
    "error"
  );

  statusText.textContent =
    "リセットしました";

  updateDisplay();

}


/*
 * イベント
 */
isbnModeButton.addEventListener("click", () => setMode("isbn"));
janModeButton.addEventListener("click", () => setMode("jan"));

startCameraButton.addEventListener(
  "click",
  startCamera
);

manualButton.addEventListener(
  "click",
  addManualISBN
);

undoButton.addEventListener(
  "click",
  undoLastBook
);

resetButton.addEventListener(
  "click",
  resetAll
);

isbnInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      addManualISBN();

    }

  }
);


/*
 * 初期表示
 */
updateDisplay();

</script>
